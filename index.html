  }
}
function startIntro(){
  var ld=document.getElementById('loader');
  if(reduce){cv.remove();if(ld)ld.remove();env.classList.add('go','ready','hintOn');return}
  var t0=performance.now();draw(0);
  if(ld){ld.classList.add('out');setTimeout(function(){ld.remove()},700)}
  env.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:3400,delay:500,easing:'cubic-bezier(.25,.1,.25,1)',fill:'both'});
  var fc=0,lastT=0,acc=0;
  (function loop(now){var ms=now-t0;if(ms>9800){cv.remove();return}
    if(lastT&&fc<40){acc+=now-lastT;fc++;if(fc===40&&acc/40>26&&DPRC>1){DPRC=1;fit();TS.forEach(prep)}}
    lastT=now;draw(ms);requestAnimationFrame(loop)})(t0);
  setTimeout(function(){env.classList.add('go')},4000);
  setTimeout(function(){env.classList.add('ready')},4400);
  setTimeout(function(){env.classList.add('hintOn')},6800);
}
var imgs=Array.prototype.slice.call(document.querySelectorAll('#env img,#c1 .art img'));
TS.forEach(function(t){t.img=new Image();t.img.decoding='async';t.img.src=t.src;imgs.push(t.img)});
var started=false,done=0,ldEl=document.querySelector('#loader span');
function go(){if(started)return;started=true;fit();TS.forEach(prep);startIntro()}
function tick(){done++;if(ldEl)ldEl.textContent='Loading '+Math.min(99,Math.round(done/imgs.length*100))+'%'}
function whenReady(i){return new Promise(function(res){if(i.complete&&i.naturalWidth){res();return}i.addEventListener('load',res);i.addEventListener('error',res)})}
var minWait=new Promise(function(r){setTimeout(r,2400)});
Promise.all([minWait].concat(imgs.map(function(i){return whenReady(i).then(function(){return i.decode?i.decode().catch(function(){}):0}).then(tick)}))).then(function(){if(ldEl)ldEl.textContent='Loading 100%';setTimeout(go,350)});
setTimeout(go,15000);
setTimeout(function(){Array.prototype.forEach.call(document.querySelectorAll('img'),function(i){if(i.decode)i.decode().catch(function(){})})},7000);
/* ---------- reveal sequences ---------- */
function rowsOf(card){return Array.prototype.slice.call(card.querySelectorAll('.row'))}
function revealSeq(card,done){
  var rs=rowsOf(card);card.classList.add('seen');
  rs.forEach(function(r,i){setTimeout(function(){r.classList.add('on')},i*230)});
  setTimeout(function(){card.classList.add('alive');done&&done()},rs.length*230+900);
}
function open(){
  if(opened)return;opened=true;
  c1.classList.remove('hidden-card');
  env.classList.add('opening');
  setTimeout(function(){env.querySelector('.flap').classList.add('fade')},600);
  setTimeout(function(){revealSeq(c1,function(){
    env.classList.add('gone');
    root.classList.add('unlocked');
    initScrollCards();
    setTimeout(function(){hintEl.classList.add('show')},500);
  })},1150);
}
env.addEventListener('click',open);
env.querySelector('.flap').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
function initScrollCards(){
  ['c4'].forEach(function(id){
    var card=document.getElementById(id),rs=rowsOf(card);
    var ro=io(function(es){var n=0;es.forEach(function(en){if(en.isIntersecting){var t=en.target;setTimeout(function(){t.classList.add('on')},n++*140);ro.unobserve(t)}})},{rootMargin:'0px 0px -10% 0px',threshold:.1});
    if(ro)rs.forEach(function(r){ro.observe(r)});else rs.forEach(function(r){r.classList.add('on')});
    var vo=io(function(es){es.forEach(function(en){card.classList.toggle('alive',en.isIntersecting)})},{rootMargin:'100px 0px'});
    if(vo)vo.observe(card);else card.classList.add('alive');
    var so=io(function(es){es.forEach(function(en){if(en.isIntersecting){card.classList.add('seen');so.unobserve(card)}})},{threshold:.3});
    if(so)so.observe(card);else card.classList.add('seen');
  });
  var v1=io(function(es){es.forEach(function(en){c1.classList.toggle('alive',en.isIntersecting)})},{rootMargin:'100px 0px'});
  if(v1)v1.observe(c1);
  window.addEventListener('scroll',function(){if(window.scrollY>30)hintEl.classList.remove('show')},{passive:true});
}
})();
</script></body></html>
